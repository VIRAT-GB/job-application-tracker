<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - JobTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                Job<span>Track</span>
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Log in to manage your job applications.
            </p>


            {% with messages = get_flashed_messages() %}

                {% for m in messages %}

                    <div class="success-message">
                        {{ m }}
                    </div>

                {% endfor %}

            {% endwith %}


            <form method="POST" action="/login">

                <div class="auth-form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="auth-form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                {% if error %}

                    <div class="auth-error">
                        {{ error }}
                    </div>

                {% endif %}


                <button type="submit" class="auth-btn">
                    Log In
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="/signup">
                    Create an account
                </a>

            </p>


            <a href="/" class="back-home">
                ← Back to home
            </a>

        </div>

    </div>

</body>

</html>
