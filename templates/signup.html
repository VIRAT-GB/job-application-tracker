<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - JobTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                Job<span>Track</span>
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Start tracking your job applications.
            </p>


            <form method="POST" action="/signup">

                <div class="auth-form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="auth-form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="auth-form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 6 characters"
                        required
                    >

                </div>


                {% if error %}

                    <div class="auth-error">
                        {{ error }}
                    </div>

                {% endif %}


                <button type="submit" class="auth-btn">
                    Create Account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="/login">
                    Log in
                </a>

            </p>


            <a href="/" class="back-home">
                ← Back to home
            </a>

        </div>

    </div>

</body>

</html>
